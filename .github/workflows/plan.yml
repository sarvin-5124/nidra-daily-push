name: plan-next-day

# Script 1 — builds tomorrow's push schedule and commits it.
# 18:30 UTC = 00:00 IST. GitHub's scheduler is best-effort and often runs a few
# minutes late; that is harmless here, the planner only needs to land before the
# first send at 10:00 IST.
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'IST date to plan (YYYY-MM-DD). Blank = tomorrow.'
        required: false
        type: string

concurrency:
  group: nidra-plan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate copy bank
        run: bun run scripts/validate-copybank.ts

      - name: Build schedule
        env:
          NIDRA_API_URL: ${{ vars.NIDRA_API_URL || secrets.NIDRA_API_URL }}
          NTFY_BASE: ${{ vars.NTFY_BASE || secrets.NTFY_BASE }}
          NTFY_TOPIC_OK: ${{ vars.NTFY_TOPIC_OK || secrets.NTFY_TOPIC_OK }}
          NTFY_TOPIC_FAIL: ${{ vars.NTFY_TOPIC_FAIL || secrets.NTFY_TOPIC_FAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SCHEDULE_DATE: ${{ inputs.date }}
        run: bun run scripts/plan.ts

      - name: Commit schedule
        run: |
          bash .github/scripts/commit-schedules.sh "plan: add next-day push schedule"
