name: execute-slot

# Script 2 — sends one slot's broadcast. Cron times are UTC, IST minus 5:30.
#
# Each slot gets TWO triggers, and neither sits on :00 or :30. GitHub's schedule
# queue is contended by the minute and worst at the top of the hour: on
# 2026-08-22 the single '30 4' trigger for morning_focus started at 05:00:00Z,
# a full 30 min late, which is longer than that day's 16 min of jitter — so the
# sleep-out-the-jitter design had nothing left to absorb the lag with and the
# push went out only because it was fired by hand.
#
#   primary, 37 min BEFORE the slot — lag lands in dead time instead of eating
#   the jitter; the script sleeps until sendAt either way
#   backstop, 1 min before the slot — covers the primary being delayed past
#   sendAt or dropped outright (the docs allow queued runs to be dropped)
#
#   03:53 + 04:29 → 10:00 IST   morning_focus
#   07:53 + 08:29 → 14:00 IST   afternoon_soundscape
#   10:53 + 11:29 → 17:00 IST   evening_meditation
#   12:53 + 13:29 → 19:00 IST   evening_soundscape
#   15:23 + 15:59 → 21:30 IST   night_nidra
#
# Two triggers cannot double-send: the `concurrency` group below serialises
# them, and the loser then reads status "sent" and skips. That guard only works
# because checkout below pins `ref: main` — see the comment there.
#
# 2026-08-26: only the 14:00 IST slot is live. The other four crons are parked
# below, not deleted — a cron with no matching slot in config/slots.json makes
# the executor throw "no slot near ..." and page the fail topic. Re-enable by
# uncommenting the pair here AND moving that slot out of `disabledSlots` in
# config/slots.json.
on:
  schedule:
    # - cron: '53 3 * * *'    # 10:00 IST morning_focus       (parked)
    # - cron: '29 4 * * *'
    - cron: '53 7 * * *'      # 14:00 IST afternoon_soundscape
    - cron: '29 8 * * *'
    # - cron: '53 10 * * *'   # 17:00 IST evening_meditation  (parked)
    # - cron: '29 11 * * *'
    # - cron: '53 12 * * *'   # 19:00 IST evening_soundscape  (parked)
    # - cron: '29 13 * * *'
    # - cron: '23 15 * * *'   # 21:30 IST night_nidra         (parked)
    # - cron: '59 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot key to send now (skips slot resolution).'
        required: false
        type: choice
        options:
          - ''
          - afternoon_soundscape
      date:
        description: 'IST schedule date (YYYY-MM-DD). Blank = today.'
        required: false
        type: string
      audience_mode:
        description: 'Who receives it. single_user sends to one id only and does NOT mark the slot sent.'
        required: true
        default: schedule
        type: choice
        options:
          - schedule
          - single_user
      user_id:
        description: 'User id for single_user mode. Required when audience_mode is single_user.'
        required: false
        type: string

concurrency:
  group: nidra-execute
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    # Covers up to MAX_WAIT_MIN (75) of waiting + send + 10 min of polling.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the BRANCH, not the event SHA. A schedule run pins the
          # default-branch head as it stood when the run was CREATED, and the
          # backstop is created before the primary sends. Left on the default,
          # the backstop would dequeue after the primary's "sent" commit and
          # still check out the pre-send file — reading status "planned" and
          # re-sending to the whole base. `ref: main` reads the tip at checkout
          # time, which is what makes the idempotency guard actually hold.
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Send slot
        env:
          NIDRA_API_URL: ${{ vars.NIDRA_API_URL || secrets.NIDRA_API_URL }}
          NIDRA_ADMIN_USER: ${{ secrets.NIDRA_ADMIN_USER }}
          NIDRA_ADMIN_PASS: ${{ secrets.NIDRA_ADMIN_PASS }}
          NTFY_BASE: ${{ vars.NTFY_BASE || secrets.NTFY_BASE }}
          NTFY_TOPIC_OK: ${{ vars.NTFY_TOPIC_OK || secrets.NTFY_TOPIC_OK }}
          NTFY_TOPIC_FAIL: ${{ vars.NTFY_TOPIC_FAIL || secrets.NTFY_TOPIC_FAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FAIL_RATE_ALERT: ${{ vars.FAIL_RATE_ALERT || secrets.FAIL_RATE_ALERT }}
          SLOT_KEY: ${{ inputs.slot }}
          # Cron runs carry no inputs, so both default to the scheduled audience.
          AUDIENCE_MODE: ${{ inputs.audience_mode }}
          TEST_USER_ID: ${{ inputs.user_id }}
          SCHEDULE_DATE: ${{ inputs.date }}
        run: bun run scripts/execute.ts

      - name: Commit result
        # Runs even on failure: a failed attempt is written back too, and that
        # record is what stops a rerun from double-sending.
        if: always()
        run: |
          bash .github/scripts/commit-schedules.sh "chore: record send result"
