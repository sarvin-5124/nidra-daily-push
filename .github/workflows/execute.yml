name: execute-slot

# Script 2 — sends one slot's broadcast. Cron times are UTC, IST minus 5:30.
#
# The live slot is 14:00 IST. It gets FIVE triggers spread across the claim
# window, none of them on :00 or :30 — GitHub's schedule queue is contended by
# the minute and worst at the top of the hour. Any single trigger can run late
# or be dropped outright (the docs allow queued runs to be dropped); whichever
# one lands first inside the window sends, and the rest read status "sent" and
# skip.
#
#   cron      IST     vs 14:00  role
#   '53 7'    13:23   -37 min   primary — lag lands in dead time, and the
#                               script sleeps until sendAt either way
#   '29 8'    13:59    -1 min   backstop for the primary being late or dropped
#   '17 9'    14:47   +47 min   late-catch
#   '53 9'    15:23   +83 min   late-catch
#   '41 10'   16:11  +131 min   last chance before the window shuts
#
# The window is NOT widened to fit these — the bounds live in
# scripts/execute.ts and stay as they are. A run may claim the slot from
# EARLY_WINDOW_MIN (45) before 14:00 to CLAIM_WINDOW_MIN (150) after it, i.e.
# 13:15–16:30 IST, so every trigger has to sit inside that. The earliest one
# must also clear MAX_WAIT_MIN (75) measured against the latest sendAt the
# planner can produce (14:30, jitter max 30) — which puts the floor at 13:15
# as well. '53 7' clears both with 8 min to spare.
#
# Triggers cannot double-send: the `concurrency` group below serialises them,
# and every loser then reads status "sent" and skips. That guard only works
# because checkout below pins `ref: main` — see the comment there.
#
# 2026-08-26: only the 14:00 IST slot is live. The other four crons are parked
# below, not deleted. Re-enable by uncommenting a pair here AND moving that
# slot out of `disabledSlots` in config/slots.json.
#
# 2026-08-29: added the three late-catch triggers. On 08-27 and 08-28 both of
# the then-only triggers fired ~10.5 h late (00:42 and 01:07 IST), landed
# outside the window, and the day's push never went out at all. The extra
# triggers cover ordinary lag and dropped runs out to +131 min. They do NOT
# cover a shift that large — nothing inside a 3 h 15 m window can — so a
# mistimed run is now a no-op instead of a page; see resolveSlot in
# scripts/execute.ts.
on:
  schedule:
    # - cron: '53 3 * * *'    # 10:00 IST morning_focus       (parked)
    # - cron: '29 4 * * *'
    - cron: '53 7 * * *'      # 14:00 IST afternoon_soundscape
    - cron: '29 8 * * *'
    - cron: '17 9 * * *'
    - cron: '53 9 * * *'
    - cron: '41 10 * * *'
    # - cron: '53 10 * * *'   # 17:00 IST evening_meditation  (parked)
    # - cron: '29 11 * * *'
    # - cron: '53 12 * * *'   # 19:00 IST evening_soundscape  (parked)
    # - cron: '29 13 * * *'
    # - cron: '23 15 * * *'   # 21:30 IST night_nidra         (parked)
    # - cron: '59 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot key to send now (skips slot resolution).'
        required: false
        type: choice
        options:
          - ''
          - afternoon_soundscape
      date:
        description: 'IST schedule date (YYYY-MM-DD). Blank = today.'
        required: false
        type: string
      audience_mode:
        description: 'Who receives it. single_user sends to one id only and does NOT mark the slot sent.'
        required: true
        default: schedule
        type: choice
        options:
          - schedule
          - single_user
      user_id:
        description: 'User id for single_user mode. Required when audience_mode is single_user.'
        required: false
        type: string

concurrency:
  group: nidra-execute
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    # Covers up to MAX_WAIT_MIN (75) of waiting + send + 10 min of polling.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the BRANCH, not the event SHA. A schedule run pins the
          # default-branch head as it stood when the run was CREATED, and the
          # backstop is created before the primary sends. Left on the default,
          # the backstop would dequeue after the primary's "sent" commit and
          # still check out the pre-send file — reading status "planned" and
          # re-sending to the whole base. `ref: main` reads the tip at checkout
          # time, which is what makes the idempotency guard actually hold.
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Send slot
        env:
          NIDRA_API_URL: ${{ vars.NIDRA_API_URL || secrets.NIDRA_API_URL }}
          NIDRA_ADMIN_USER: ${{ secrets.NIDRA_ADMIN_USER }}
          NIDRA_ADMIN_PASS: ${{ secrets.NIDRA_ADMIN_PASS }}
          NTFY_BASE: ${{ vars.NTFY_BASE || secrets.NTFY_BASE }}
          NTFY_TOPIC_OK: ${{ vars.NTFY_TOPIC_OK || secrets.NTFY_TOPIC_OK }}
          NTFY_TOPIC_FAIL: ${{ vars.NTFY_TOPIC_FAIL || secrets.NTFY_TOPIC_FAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FAIL_RATE_ALERT: ${{ vars.FAIL_RATE_ALERT || secrets.FAIL_RATE_ALERT }}
          SLOT_KEY: ${{ inputs.slot }}
          # Cron runs carry no inputs, so both default to the scheduled audience.
          AUDIENCE_MODE: ${{ inputs.audience_mode }}
          TEST_USER_ID: ${{ inputs.user_id }}
          SCHEDULE_DATE: ${{ inputs.date }}
        run: bun run scripts/execute.ts

      - name: Commit result
        # Runs even on failure: a failed attempt is written back too, and that
        # record is what stops a rerun from double-sending.
        if: always()
        run: |
          bash .github/scripts/commit-schedules.sh "chore: record send result"
